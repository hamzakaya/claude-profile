name: Release

# Push a tag that matches VERSION in the script:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches script version
        run: |
          v=$(make -s version)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != VERSION=$v in claude-profile"; exit 1; }
      - name: Check
        run: make check
      - name: Build assets
        run: |
          mkdir dist
          cp claude-profile install.sh dist/
          (cd dist && sha256sum claude-profile install.sh > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
